        state: >-
          {% set p = parameters.get(states('input_select.pw030_servisni_parametr'), {}) %}
          {% set raw = states(p.source).split(',')[p.index] | default(none) | int(none) if p else none %}
          {% if p.get('decoded', false) %}
            {{ states(p.source) | float(none) }}
          {% elif raw is number %}
            {% if 'mask' in p %}
              {{ (raw // p.mask) % 2 }}
            {% else %}
              {% set signed = raw - 65536 if p.get('signed', false) and raw >= 32768 else raw %}
              {{ (signed * p.scale) | round(1) if 'scale' in p else signed }}
            {% endif %}
          {% else %}{{ none }}{% endif %}
        attributes:
          jednotka: >-
            {{ parameters.get(states('input_select.pw030_servisni_parametr'), {}).get('unit', '') }}
          povoleny_zapis: >-
            {% set p = parameters.get(states('input_select.pw030_servisni_parametr'), {}) %}
            {% if 'choices' in p %}{{ p.choices.keys() | join(', ') }}
            {% elif 'min' in p %}{{ p.min }} až {{ p.max }}
            {% else %}Pouze čtení{% endif %}
          popis: >-
            {{ parameters.get(states('input_select.pw030_servisni_parametr'), {}).get('note', '') }}
