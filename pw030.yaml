        step: 1
        availability: >-
          {{ has_value('sensor.pw030_reg_0091') and is_state('input_boolean.pw030_povolit_zapis', 'on') }}
        state: "{{ states('sensor.pw030_reg_0091') | int(none) }}"
        set_value:
