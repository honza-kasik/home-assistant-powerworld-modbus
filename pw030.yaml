    climate:
      - name: PW030
        unique_id: pw030_climate
        default_entity_id: climate.pw030
        temperature_unit: °C
        precision: 0.1
        target_temperature_step: 1
        min_temperature: 7
        max_temperature: 60
        optimistic: false
        availability: >-
          {{ is_state('input_boolean.pw030_povolit_zapis', 'on')
             and has_value('sensor.pw030_zapnuti_a_stav_ridiciho_slova')
             and states('sensor.pw030_provozni_rezim') | int(-1) in [0, 1, 2, 3, 4]
             and has_value('sensor.pw030_reg_0001') }}
        hvac_modes: "{{ ['off', 'heat', 'cool'] }}"
        hvac_mode: >-
          {% if states('sensor.pw030_zapnuti_a_stav_ridiciho_slova') | int(0) | bitwise_and(1) == 0 %}
            off
          {% elif states('sensor.pw030_provozni_rezim') | int(-1) in [2, 4] %}
            cool
          {% else %}
            heat
          {% endif %}
        current_temperature: >-
          {% set mode = states('sensor.pw030_provozni_rezim') | int(-1) %}
          {{ states('sensor.pw030_teplota_zasobniku_tuv' if mode == 0 else 'sensor.pw030_teplota_vody_na_vstupu') | float(none) }}
        target_temperature: >-
          {% set mode = states('sensor.pw030_provozni_rezim') | int(-1) %}
          {% set entity = 'sensor.pw030_cilova_teplota_tuv' if mode == 0 else
                          'sensor.pw030_cilova_teplota_chlazeni' if mode in [2, 4] else
                          'sensor.pw030_cilova_teplota_vytapeni' %}
          {{ states(entity) | float(none) }}
        preset_modes: "{{ ['Smart', 'Silent', 'Powerful'] }}"
        preset_mode: >-
          {{ {0: 'Smart', 16: 'Powerful', 32: 'Silent'}.get(states('sensor.pw030_reg_0001') | int(-1) | bitwise_and(48)) }}
        attributes:
          provozni_rezim: >-
            {{ parameters['0004 Provozní režim'].choices.get(states('sensor.pw030_provozni_rezim') | int(-1)) }}
          odmrazovani: "{{ states('binary_sensor.pw030_bit_8003_7') }}"
          kompresor: "{{ states('binary_sensor.pw030_bit_8004_0') }}"
        set_hvac_mode:
          - choose:
              - conditions: "{{ hvac_mode == 'off' }}"
                sequence:
                  - action: script.pw030_zapsat_registr
                    data:
                      parameter: "0000.0 Zapnutí čerpadla"
                      requested: 0
            default:
              - action: script.pw030_zapsat_registr
                data:
                  parameter: "0004 Provozní režim"
                  requested: >-
                    {% set combined = states('sensor.pw030_provozni_rezim') | int(-1) in [3, 4] %}
                    {{ (3 if combined else 1) if hvac_mode == 'heat' else (4 if combined else 2) }}
              - action: script.pw030_zapsat_registr
                data:
                  parameter: "0000.0 Zapnutí čerpadla"
                  requested: 1
        set_temperature:
          - action: script.pw030_zapsat_registr
            data:
              parameter: >-
                {% set mode = states('sensor.pw030_provozni_rezim') | int(-1) %}
                {{ '008F P03 Cílová teplota TUV' if mode == 0 else
                   '0090 P04 Cílová teplota chlazení' if mode in [2, 4] else
                   '0091 P05 Cílová teplota vytápění' }}
              requested: "{{ temperature }}"
        set_preset_mode:
          - action: script.pw030_zapsat_registr
            data:
              parameter: "0001 Režim výkonu"
              requested: "{{ {'Smart': 0, 'Powerful': 16, 'Silent': 32}[preset_mode] }}"
    select:
      - name: PW030 Nastavit režim
        unique_id: pw030_mode_control
        default_entity_id: select.pw030_nastavit_rezim
        availability: >-
          {{ has_value('sensor.pw030_reg_0004') and is_state('input_boolean.pw030_povolit_zapis', 'on') }}
        options: >-
          {{ parameters['0004 Provozní režim'].choices.values() | list }}
        state: >-
          {{ parameters['0004 Provozní režim'].choices.get(states('sensor.pw030_reg_0004') | int(-1)) }}
        select_option:
          - action: script.pw030_zapsat_registr
            data:
              parameter: "0004 Provozní režim"
              requested: >-
                {% set match = parameters['0004 Provozní režim'].choices.items() | selectattr('1', 'eq', option) | first %}
                {{ match[0] | default(none) }}
      - name: PW030 Režim výkonu
        unique_id: pw030_performance_mode
        default_entity_id: select.pw030_rezim_vykonu
        availability: >-
          {{ has_value('sensor.pw030_reg_0001') and is_state('input_boolean.pw030_povolit_zapis', 'on') }}
        options: "{{ ['Smart', 'Silent', 'Powerful'] }}"
        state: >-
          {% set raw = states('sensor.pw030_reg_0001') | int(-1) %}
          {{ {0: 'Smart', 16: 'Powerful', 32: 'Silent'}.get(raw | bitwise_and(48)) }}
        select_option:
          - action: script.pw030_zapsat_registr
            data:
              parameter: "0001 Režim výkonu"
              requested: "{{ {'Smart': 0, 'Powerful': 16, 'Silent': 32}[option] }}"
    number:
