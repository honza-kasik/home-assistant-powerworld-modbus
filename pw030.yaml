        device_class: frequency
        unit_of_measurement: Hz
        min: 30
        max: 120
        step: 1
        availability: >-
          {{ has_value('sensor.pw030_reg_00ef') and is_state('input_boolean.pw030_povolit_zapis', 'on') }}
        state: "{{ states('sensor.pw030_reg_00ef') | int(none) }}"
        set_value:
          - action: script.pw030_zapsat_registr
            data:
              parameter: "00EF R30 Maximální frekvence při tichém vytápění"
              requested: "{{ value }}"
      - name: PW030 Limit frekvence při tichém chlazení
        unique_id: pw030_silent_cooling_frequency_limit
        default_entity_id: number.pw030_tichy_limit_chlazeni
        device_class: frequency
        unit_of_measurement: Hz
        min: 30
        max: 120
        step: 1
        availability: >-
          {{ has_value('sensor.pw030_reg_00f1') and is_state('input_boolean.pw030_povolit_zapis', 'on') }}
        state: "{{ states('sensor.pw030_reg_00f1') | int(none) }}"
        set_value:
          - action: script.pw030_zapsat_registr
            data:
              parameter: "00F1 R32 Maximální frekvence při tichém chlazení"
              requested: "{{ value }}"
    switch:
      - name: PW030 Zapnutí
        unique_id: pw030_power_control
        default_entity_id: switch.pw030_zapnuti
        availability: >-
          {{ has_value('binary_sensor.pw030_bit_0000_0') and is_state('input_boolean.pw030_povolit_zapis', 'on') }}
        state: "{{ is_state('binary_sensor.pw030_bit_0000_0', 'on') }}"
        turn_on:
          - action: script.pw030_zapsat_registr
            data:
              parameter: "0000.0 Zapnutí čerpadla"
              requested: 1
        turn_off:
          - action: script.pw030_zapsat_registr
            data:
              parameter: "0000.0 Zapnutí čerpadla"
              requested: 0
    button:
      - name: PW030 Zapsat servisní parametr
        unique_id: pw030_service_commit
        default_entity_id: button.pw030_zapsat_servisni_parametr
        availability: >-
          {% set p = parameters.get(states('input_select.pw030_servisni_parametr'), {}) %}
          {{ is_state('input_boolean.pw030_povolit_zapis', 'on')
             and ('min' in p or 'choices' in p)
             and has_value(p.source)
             and is_number(states('input_text.pw030_nova_hodnota') | replace(',', '.'))
             and states.input_text.pw030_nova_hodnota.last_changed
                 >= states.input_select.pw030_servisni_parametr.last_changed }}
        press:
          - condition: template
            value_template: >-
              {{ states.input_text.pw030_nova_hodnota.last_changed
                 >= states.input_select.pw030_servisni_parametr.last_changed }}
          - action: script.pw030_zapsat_registr
            data:
              parameter: "{{ states('input_select.pw030_servisni_parametr') }}"
              requested: "{{ states('input_text.pw030_nova_hodnota') | replace(',', '.') }}"

script:
  pw030_zapsat_registr:
    alias: PW030 Zapsat a ověřit registr
    mode: queued
    variables:
      modbus_hub: tepelne_cerpadlo
      modbus_unit: 1
      parameters: *pw030_parameters
    sequence:
      - variables:
          p: "{{ parameters.get(parameter | default(''), {}) }}"
          requested_value: "{{ requested | default(none) | float(none) }}"
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('input_boolean.pw030_povolit_zapis', 'on')
                 or not (1 <= modbus_unit | int(0) <= 247) }}
        then:
          - stop: Zápis je vypnutý nebo je adresa čerpadla neplatná.
            error: true
      - if:
          - condition: template
            value_template: >-
              {{ requested_value is not number or not is_number(requested_value)
                 or not (('choices' in p and requested_value in p.choices)
                         or ('min' in p and p.min <= requested_value <= p.max)) }}
        then:
          - stop: Hodnota není platná nebo zvolený parametr nemá zdokumentovaný zápis.
            error: true
      - variables:
          scaled: "{{ requested_value / p.get('scale', 1) }}"
          desired: "{{ scaled | round(0) | int }}"
          started: "{{ as_timestamp(now()) }}"
      - if:
          - condition: template
            value_template: "{{ ((scaled - desired) | abs) > 0.000001 }}"
        then:
          - stop: Hodnota neodpovídá kroku registru.
            error: true
      - action: homeassistant.update_entity
        target:
          entity_id: "{{ p.source }}"
      - variables:
          current: "{{ states(p.source).split(',')[p.index] | default(none) | int(none) }}"
      - if:
          - condition: template
            value_template: >-
              {{ current is not number
                 or as_timestamp(states[p.source].last_reported, 0) < started }}
        then:
          - stop: Čerpadlo neposkytlo čerstvou hodnotu registru.
            error: true
      - variables:
          word: >-
            {% if 'mask' in p %}
              {{ current + (desired - (current // p.mask) % 2) * p.mask }}
            {% elif 'value_mask' in p %}
              {{ current - (current | bitwise_and(p.value_mask)) + desired }}
            {% else %}
              {{ desired % 65536 }}
            {% endif %}
      - if:
          - condition: template
            value_template: "{{ word == current }}"
        then:
          - stop: Registr už obsahuje požadovanou hodnotu.
      - if:
          - condition: template
            value_template: "{{ not is_state('input_boolean.pw030_povolit_zapis', 'on') }}"
        then:
          - stop: Zápis byl mezitím vypnut.
            error: true
      - action: modbus.write_register
        data:
          hub: "{{ modbus_hub }}"
          slave: "{{ modbus_unit }}"
          address: "{{ p.address }}"
          value: "{{ word }}"
      - variables:
          written: "{{ as_timestamp(now()) }}"
      - action: homeassistant.update_entity
        target:
          entity_id: "{{ p.source }}"
      - variables:
          actual: "{{ states(p.source).split(',')[p.index] | default(none) | int(none) }}"
      - if:
          - condition: template
            value_template: >-
              {{ actual is not number or as_timestamp(states[p.source].last_reported, 0) < written
                 or actual != word }}
        then:
          - stop: Zpětné čtení nepotvrdilo zápis. Zkontroluj aktuální stav.
            error: true
