        unique_id: pw030_setpoint_tuv
        default_entity_id: number.pw030_nastavit_teplotu_tuv
        device_class: temperature
        unit_of_measurement: "°C"
        min: 28
        max: 60
        step: 1
        availability: >-
          {{ has_value('sensor.pw030_reg_008f') and is_state('input_boolean.pw030_povolit_zapis', 'on') }}
